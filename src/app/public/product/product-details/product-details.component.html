<div class="row">
  <div class="col s12" *ngIf="attrs">
    <table class="bordered" >
      <tbody id="details">
        <tr class="attr"
        *ngFor="let attr of attrs"
        >
          <ng-container *ngIf="validateAttr(attr)">
            <th>{{attr}}</th>
            <td>

              <span [ngSwitch]="attrType(attr)">
              <span *ngSwitchCase="'true'">
                <i class="fas fa-check blue-text darken-4"></i>
              </span>
              <span *ngSwitchCase="'array'">
                <span *ngFor="let item of attr; index as i">
                  {{item}}<span *ngIf="i < attr.length">, </span>
                </span>
              </span>
              <span *ngSwitchDefault>
                {{attr}}
              </span>
              </span>

            </td>
          </ng-container>
        </tr>
      </tbody>
    </table>
  </div>
</div>
