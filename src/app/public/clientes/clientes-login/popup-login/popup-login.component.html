<mat-tab-group [selectedIndex]="tabIndex">
    <mat-tab label="Regístrate">
        <app-register-form (getRegistered)="onRegistered()" ></app-register-form>
    </mat-tab>
    <mat-tab label="Inicia Sesión">
        <mx-login-card
        (onSubmit)="onPasswordLoggin($event)"
        (restorePwd)="restorePwd()"
        ></mx-login-card>
    </mat-tab>
</mat-tab-group>
