<mx-list-crud
listName="Sucursales"
[selectTemplate]="select"
[addTemplate]="add"
[height_vh]="'60vh'"
(onSave)="branchS.onSave$.next(true)"
[List]="sucursales"
itemSelector="displayName"
>
    <ng-template #select let-branch="item" >
        <mx-branch-form (updated)="onUpdate()" [Sucursal]="branch"></mx-branch-form>
    </ng-template>

    <ng-template #add>
        <mx-branch-form (updated)="onUpdate()"></mx-branch-form>
    </ng-template>

</mx-list-crud>
